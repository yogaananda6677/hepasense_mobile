name: hepasense_mobile
description: "HepaSense patient-facing mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_app_installations: ^0.4.2+7
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/health_tips_banner.png
